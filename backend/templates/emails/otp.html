<!DOCTYPE html>
<html lang="vi">
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#172b4d;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0"
               style="background:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td>
              <h2 style="margin:0 0 16px;">Xác thực {{ purpose_label }}</h2>
              <p>Xin chào,</p>
              <p>Mã xác thực của bạn là:</p>
              <p style="font-size:32px;font-weight:bold;letter-spacing:8px;text-align:center;
                        background:#f4f5f7;border-radius:6px;padding:16px;margin:16px 0;">
                {{ code }}
              </p>
              <p>Mã có hiệu lực trong <strong>{{ ttl_minutes }} phút</strong> và chỉ dùng được một lần.</p>
              <p style="color:#b3261e;">Tuyệt đối không chia sẻ mã này cho bất kỳ ai.</p>
              <p style="color:#6b778c;font-size:13px;">
                Nếu bạn không thực hiện yêu cầu này, hãy bỏ qua email này.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
